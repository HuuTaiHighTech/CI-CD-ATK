name: CI/CD ATK

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Login Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # ===== API =====
    - name: Build API image
      run: docker build -t taipro573467/atk-api:latest ./atk-api

    - name: Push API image
      run: docker push taipro573467/atk-api:latest

    # ===== WEB =====
    - name: Build WEB image
      run: docker build -t taipro573467/atk-web:latest ./atk-web

    - name: Push WEB image
      run: docker push taipro573467/atk-web:latest

    # ===== ADMIN =====
    - name: Build ADMIN image
      run: docker build -t taipro573467/atk-admin:latest ./atk-admin

    - name: Push ADMIN image
      run: docker push taipro573467/atk-admin:latest