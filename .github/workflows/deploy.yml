name: CI/CD ATK

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Login Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # ===== API (Thư mục ./api) =====
    - name: Build API image
      run: |
        docker build -t taipro573467/atk-api:latest ./api
        docker push taipro573467/atk-api:latest

    # ===== WEB (Thư mục ./web) =====
    - name: Build WEB image
      run: |
        docker build -t taipro573467/atk-web:latest ./web
        docker push taipro573467/atk-web:latest

    # ===== ADMIN (Thư mục ./admin) =====
    - name: Build ADMIN image
      run: |
        docker build -t taipro573467/atk-admin:latest ./admin
        docker push taipro573467/atk-admin:latest